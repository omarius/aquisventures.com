<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aquis Ventures GmbH</title>
    <meta name="description" content="Aquis Ventures GmbH – Kontakt: mail@aquisventures.com" />
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        padding: 2rem 1rem;
        background: #fff;
        color: #2b2b2b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      img { width: min(360px, 80vw); height: auto; }
      address { font-style: normal; line-height: 1.7; font-size: 1.05rem; }
      a { color: inherit; text-decoration: none; border-bottom: 1px solid #bbb; }
      a:hover { border-bottom-color: #2b2b2b; }
    </style>
  </head>
  <body>
    <h1><img src="logo.png" alt="Aquis Ventures" width="561" height="149" /></h1>
    <address>
      Aquis Ventures GmbH<br />
      <a href="mailto:mail@aquisventures.com">mail@aquisventures.com</a>
    </address>
  </body>
</html>
